    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">FerreMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html">Blogs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Nosotros.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactos.html">Contactos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inicio sesion.html">Iniciar Sesión</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 700px;">

        <h1 class="text-center mb-4">Contacto</h1>

        <section class="bg-white text-dark p-4 rounded shadow-sm">

            <form id="form-contacto" novalidate>

                <div class="mb-3">
                    <label for="contactoNombre" class="form-label">
                        Nombre *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="contactoNombre"
                        maxlength="100"
                        required>

                    <div class="invalid-feedback">
                        El nombre es obligatorio y debe tener máximo 100 caracteres.
                    </div>
                </div>


                <div class="mb-3">
                    <label for="contactoCorreo" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="contactoCorreo"
                        maxlength="100">

                    <div class="invalid-feedback">
                        Usa un correo @duoc.cl, @profesor.duoc.cl o @gmail.com.
                    </div>
                </div>


                <div class="mb-3">
                    <label for="contactoComentario" class="form-label">
                        Comentario *
                    </label>

                    <textarea
                        class="form-control"
                        id="contactoComentario"
                        rows="5"
                        maxlength="500"
                        required>
                    </textarea>

                    <div class="invalid-feedback">
                        El comentario es obligatorio y debe tener máximo 500 caracteres.
                    </div>
                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Enviar mensaje

                </button>

            </form>

        </section>

    </main>
</body>
</html>
