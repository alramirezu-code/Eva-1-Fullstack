<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">FerreMarket</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="inicio sesion.html">Iniciar Sesion</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">placeholder</a>
                    </li>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <h1>Agregar Producto</h1>

        <section>
            <form id="formProducto">

                <div class="campo">
                    <label for="codigo">Código Producto</label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Ej: PRO001">

                    <span id="errorCodigo" class="error"></span>
                </div>


                <div class="campo">
                    <label for="nombre">Nombre</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingrese nombre">

                    <span id="errorNombre" class="error"></span>
                </div>


                <div class="campo">
                    <label for="descripcion">Descripción</label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        placeholder="Ingrese descripción del producto">
                    </textarea>

                    <span id="errorDescripcion" class="error"></span>
                </div>


                <div class="campo">
                    <label for="precio">Precio</label>

                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        placeholder="Ingrese precio"
                        min="0">

                    <span id="errorPrecio" class="error"></span>
                </div>


                <div class="campo">
                    <label for="stock">Stock</label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        placeholder="Ingrese stock"
                        min="0">

                    <span id="errorStock" class="error"></span>
                </div>


                <div class="campo">
                    <label for="stockCritico">Stock Crítico</label>

                    <input
                        type="number"
                        id="stockCritico"
                        name="stockCritico"
                        placeholder="Ingrese stock crítico"
                        min="0">

                    <span id="errorStockCritico" class="error"></span>
                </div>


                <div class="campo">

                    <label for="categoria">Categoría</label>

                    <select id="categoria" name="categoria">

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="materiales">
                            Materiales
                        </option>

                        <option value="herramientas">
                            Herramientas
                        </option>

                        <option value="adhesivo">
                            Adhesivos
                        </option>

                    </select>

                    <span id="errorCategoria" class="error"></span>

                </div>


                <div class="campo">

                    <label for="imagen">Imagen</label>

                    <input
                        type="text"
                        id="imagen"
                        name="imagen"
                        placeholder="Ej: img/producto_default.webp">

                    <span id="errorImagen" class="error"></span>

                </div>


                <button
                    type="submit"
                    class="agregarProducto">

                    Agregar Producto

                </button>

            </form>

            <div id="mensaje" class="exito"></div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
