            <h1> Agregar Producto</h1>
            <section>
                <form id = "formProducto">
                    <div class="campo">
                        <label for="imagen">Imagen</label>
                        <input
                            type="text"
                            id="imagen"
                            name="imagen"
                            placeholder="Ej: img/producto.webp">
                    </div>

                    <div class = "campo">
                        <label for="codigo"></label>
                        <input 
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="Ingrese Codigo">
                        <span id="errorCodigo" class = "error"></span>
                    </div>
                    <div class = "campo">
                        <label for="nombre">Nombre</label>
                        <input 
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingrese nombre">
                        <span id="errorNombre" class = "error"></span>
                    </div>
                    <div class = "campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria">
                            <option value="">Seleccione una categoria</option>
                            <option value="materiales">Materiales</option>
                            <option value="herramientas">Herramientas</option>
                            <option value="misceláneo">Misceláneo</option>
                        </select>
                        <span id="errorCategoria" class = "error"></span>
                    </div>
                    <div class = "campo">
                        <label for="precio">Precio</label>
                        <input 
                        type="number"
                        id="precio"
                        name="precio"
                        placeholder="Ingrese precio">
                        <span id="errorPrecio" class = "error"></span>
                    </div>
                    <div class = "campo">
                        <label for="descuento">Descuento</label>
                        <input 
                        type="number"
                        id="descuento"
                        name="descuento"
                        placeholder="Ingrese descuento">
                        <span id="errordescuento" class = "error"></span>
                        <span id="warningdescuento" class = "warning"></span>
                    </div>
                    <div class = "campo">
                        <label for="descuento">DescuentoDia</label>
                        <input 
                        type="date"
                        id="descuentodia"
                        name="descuentodia"
                        placeholder="Ingrese descuentodia">
                        <span id="errordescuentodia" class = "error"></span>
                    </div>
                    <button type = "submit" class = "agregarProducto">
                        Agregar Producto
                    </button> 
                </form>
                <div id="mensaje" class="exito"></div>
            </section>
    </main>

    <script src="script.js"></script>
